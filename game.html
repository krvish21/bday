<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chappal Strike: Modi vs The Roach Army</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  body {
    font-family:'Segoe UI', system-ui, sans-serif;
    background:radial-gradient(circle at 50% 15%, #1b2a4a, #070c18 75%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; overflow:hidden; color:#fff;
  }
  #wrap { position:relative; }
  canvas {
    display:block; border-radius:14px; cursor:none;
    box-shadow:0 10px 60px rgba(0,0,0,.7), 0 0 0 2px #2c3e6b;
    touch-action:none;
  }
  .overlay {
    position:absolute; inset:0; border-radius:14px;
    background:rgba(6,10,22,.92); z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
  }
  .overlay.hidden { display:none; }
  h1 {
    font-size:clamp(22px,4vw,36px);
    background:linear-gradient(90deg,#ff9933,#fff,#138808);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay p { color:#b9c8e8; max-width:460px; line-height:1.6; font-size:14px; }
  .ctrls { font-size:13px; color:#8fa3cc; background:#101a33; border:1px solid #24345c;
           padding:10px 18px; border-radius:10px; line-height:1.7; }
  button {
    background:linear-gradient(135deg,#ff9933,#ff5722); border:none; color:#fff;
    font-weight:800; font-size:17px; padding:13px 40px; border-radius:30px;
    cursor:pointer; box-shadow:0 5px 20px rgba(255,120,40,.45); transition:transform .1s;
  }
  button:hover { transform:scale(1.06); }
  .upgrades { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .upcard {
    background:linear-gradient(160deg,#16233f,#0d1526); border:2px solid #3b5aa6;
    border-radius:14px; width:150px; padding:16px 12px; cursor:pointer;
    transition:transform .12s, border-color .12s;
  }
  .upcard:hover { transform:translateY(-6px) scale(1.04); border-color:#ffd166; }
  .upcard .ico { font-size:34px; }
  .upcard .nm { font-weight:800; margin:6px 0 4px; font-size:14px; color:#ffd166; }
  .upcard .ds { font-size:12px; color:#a9bce3; line-height:1.4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>

  <div class="overlay" id="menu">
    <h1>🪳 Chappal Strike 🩴</h1>
    <p>The Roach Army has breached the office! Survive endless waves, build your loadout, and defend the Swachh Mission.</p>
    <div class="ctrls">🖱️ <b>WASD / Arrows</b> to move &nbsp;•&nbsp; <b>Click / Space</b> to swat<br>
    📱 Touch &amp; hold to move • Quick tap to swat</div>
    <p id="bestLine"></p>
    <button onclick="startGame()">Start Mission ▶</button>
  </div>

  <div class="overlay hidden" id="upOverlay">
    <h1 style="font-size:26px">⬆️ Wave Cleared! Choose an upgrade</h1>
    <div class="upgrades" id="upCards"></div>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <h1>💀 Mission Failed</h1>
    <p id="finalStats"></p>
    <button onclick="startGame()">Try Again 🔁</button>
  </div>
</div>

<script>
"use strict";
const W = 960, H = 600;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}
function tone(f, d, type, vol, slide) {
  try {
    const ac = audio(), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + d);
    g.gain.value = vol || .12;
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch(e){}
}
const sfx = {
  swat: () => tone(600,.07,'square',.08,200),
  splat:() => { tone(140,.12,'sawtooth',.15,60); tone(300,.05,'square',.06,80); },
  hurt: () => tone(180,.25,'sawtooth',.18,70),
  pickup:() => tone(700,.1,'sine',.12,1200),
  upgrade:()=> { tone(400,.1,'sine',.12); setTimeout(()=>tone(550,.1,'sine',.12),90); setTimeout(()=>tone(750,.14,'sine',.12),180); },
  wave:  () => { tone(300,.15,'triangle',.14,600); setTimeout(()=>tone(450,.2,'triangle',.14,800),120); }
};

/* ---------- state ---------- */
let state = 'menu'; // menu | play | upgrade | over
let player = null;
let roaches = [], particles = [], texts = [], splats = [], pickups = [];
let wave, toSpawn, spawnTimer, score, combo, comboTimer, shake, banner, best;
best = +(localStorage.getItem('chappalBest') || 0);
document.getElementById('bestLine').textContent = best ? `🏆 Best score: ${best}` : '';

const mouse = { x: W/2, y: H/2 };
const keys = {};
let lastTap = 0;

/* ---------- upgrades ---------- */
const UPS = [
  { ico:'🩴', nm:'Wider Chappal', ds:'Swat arc +25%', apply:p=>p.arc*=1.25 },
  { ico:'⚡', nm:'Rapid Reflexes', ds:'Swing cooldown -22%', apply:p=>p.cool*=0.78 },
  { ico:'🍵', nm:'Kadak Chai', ds:'Restore 50% HP', apply:p=>p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.5) },
  { ico:'👟', nm:'Track Shoes', ds:'Move speed +18%', apply:p=>p.speed*=1.18 },
  { ico:'💪', nm:'Desh Ka Chappal', ds:'+1 damage per swat', apply:p=>p.dmg++ },
  { ico:'🌀', nm:'Spin Doctor', ds:'Every 5th swing hits 360°', apply:p=>p.spinLv++ },
  { ico:'🧊', nm:'Thandi Hawa', ds:'Roaches 12% slower', apply:p=>p.slow=Math.min(.45,p.slow+.12) },
];

/* ---------- entities ---------- */
function newPlayer() {
  return { x:W/2, y:H/2, r:20, hp:100, maxHp:100, speed:210, angle:0,
           arc:1.9, cool:.42, cd:0, dmg:1, swing:null, invuln:0,
           spinLv:0, swingCount:0, slow:0 };
}
function makeRoach(type) {
  const edge = Math.floor(Math.random()*4);
  let x,y;
  if (edge===0){x=-30;y=Math.random()*H;}
  else if(edge===1){x=W+30;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=-30;}
  else {x=Math.random()*W;y=H+30;}
  const t = {
    normal:{hp:1,speed:78, size:22,score:10,col:'#a8854f'},
    fast:  {hp:1,speed:138,size:16,score:15,col:'#d4b06a'},
    tank:  {hp:4,speed:46, size:34,score:30,col:'#6b4a2b'},
    queen: {hp:9,speed:34, size:44,score:60,col:'#8a3b6e'},
  }[type];
  return { x,y,type,hp:t.hp,maxHp:t.hp,speed:t.speed,size:t.size,score:t.score,
           angle:0, wob:Math.random()*Math.PI*2, babyCd:0, hitFlash:0 };
}

/* ---------- game flow ---------- */
function startGame() {
  audio();
  hideAll();
  player = newPlayer();
  roaches = []; particles=[]; texts=[]; splats=[]; pickups=[];
  wave = 0; score = 0; combo = 0; comboTimer = 0; shake = 0;
  state = 'play';
  nextWave();
}
function nextWave() {
  wave++;
  const count = 5 + wave*3;
  toSpawn = count;
  spawnTimer = 0;
  banner = { text: `WAVE ${wave}`, t: 2 };
  sfx.wave();
}
function waveCleared() {
  state = 'upgrade';
  sfx.upgrade();
  const box = document.getElementById('upCards');
  box.innerHTML = '';
  const pool = [...UPS].sort(()=>Math.random()-.5).slice(0,3);
  pool.forEach(u => {
    const d = document.createElement('div');
    d.className = 'upcard';
    d.innerHTML = `<div class="ico">${u.ico}</div><div class="nm">${u.nm}</div><div class="ds">${u.ds}</div>`;
    d.onclick = () => { u.apply(player); sfx.upgrade(); hideAll(); state='play'; nextWave(); };
    box.appendChild(d);
  });
  document.getElementById('upOverlay').classList.remove('hidden');
}
function gameOver() {
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('chappalBest', best); }
  document.getElementById('finalStats').innerHTML =
    `You survived to <b>Wave ${wave}</b> with <b>${score}</b> points.<br><br>` +
    (score===best ? '🏆 <b>New best score!</b>' : `🏆 Best: ${best}`) +
    (wave>=5 ? '<br>🎖️ Swachh Warrior status achieved!' : '');
  document.getElementById('overOverlay').classList.remove('hidden');
}
function hideAll() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('upOverlay').classList.add('hidden');
  document.getElementById('overOverlay').classList.add('hidden');
}

/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' && state==='play') { e.preventDefault(); trySwing(); }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x:(cx-r.left)*W/r.width, y:(cy-r.top)*H/r.height };
}
canvas.addEventListener('mousemove', e => { const p = toLogical(e); mouse.x=p.x; mouse.y=p.y; });
canvas.addEventListener('mousedown', e => { const p = toLogical(e); mouse.x=p.x; mouse.y=p.y; trySwing(); });

let touchMove = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); audio();
  const p = toLogical(e); mouse.x=p.x; mouse.y=p.y;
  touchMove = { x:p.x, y:p.y, t:performance.now(), moved:false };
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const p = toLogical(e);
  if (touchMove && Math.hypot(p.x-touchMove.x, p.y-touchMove.y) > 14) touchMove.moved = true;
  mouse.x = p.x; mouse.y = p.y;
}, {passive:false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (touchMove && !touchMove.moved && performance.now()-touchMove.t < 300) trySwing();
  touchMove = null;
}, {passive:false});

/* ---------- combat ---------- */
function trySwing() {
  if (player.cd > 0 || player.swing) return;
  player.swingCount++;
  const spin = player.spinLv > 0 && player.swingCount % 5 === 0;
  player.swing = { t:0, dur:.22, dir:player.angle, arc: spin ? Math.PI*2 : player.arc, spin };
  player.cd = player.cool;
  sfx.swat();
  const range = 92;
  roaches.forEach(r => {
    const dx = r.x-player.x, dy = r.y-player.y;
    const d = Math.hypot(dx,dy);
    if (d > range + r.size) return;
    let da = Math.atan2(dy,dx) - player.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    if (Math.abs(da) > (spin ? Math.PI : player.arc/2)) return;
    hitRoach(r, dx/d, dy/d);
  });
}
function hitRoach(r, nx, ny) {
  r.hp -= player.dmg;
  r.hitFlash = .12;
  r.x += nx*26; r.y += ny*26;
  splat(r.x, r.y);
  if (r.hp <= 0) {
    score += r.score * (1 + Math.floor(combo/5));
    combo++; comboTimer = 2;
    texts.push({x:r.x, y:r.y, t:'+'+r.score*(1+Math.floor(combo/5)), life:1, col:'#ffd166'});
    sfx.splat();
    if (r.type==='queen') shake = Math.max(shake, 10);
    // drops
    const roll = Math.random();
    if (roll < .08) pickups.push({x:r.x, y:r.y, kind:'heart', life:8});
    else if (roll < .18) pickups.push({x:r.x, y:r.y, kind:'star', life:8});
    roaches.splice(roaches.indexOf(r), 1);
  }
}
function splat(x, y) {
  for (let i=0;i<10;i++) {
    const a = Math.random()*Math.PI*2, s = 40+Math.random()*160;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:.5+Math.random()*.4,
                    r:2+Math.random()*4, col: Math.random()<.5 ? '#7da33c' : '#4d6b1f'});
  }
  splats.push({x, y, r:8+Math.random()*14, life:6});
}

/* ---------- update ---------- */
let last = performance.now();
function update(dt) {
  if (state !== 'play') return;
  // spawn
  if (toSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = Math.max(.35, 1.15 - wave*.07);
      toSpawn--;
      let type = 'normal';
      const roll = Math.random();
      if (wave >= 6 && roll < .06) type = 'queen';
      else if (wave >= 4 && roll < .22) type = 'tank';
      else if (wave >= 2 && roll < .48) type = 'fast';
      roaches.push(makeRoach(type));
    }
  } else if (roaches.length === 0) {
    waveCleared(); return;
  }

  // combo decay
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
  if (shake > 0) shake = Math.max(0, shake - dt*30);
  if (banner && banner.t > 0) banner.t -= dt;

  // player movement
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (touchMove) { // move toward touch point
    const dx = mouse.x - player.x, dy = mouse.y - player.y;
    const d = Math.hypot(dx,dy);
    if (d > 24) { mx = dx/d; my = dy/d; }
  }
  const ml = Math.hypot(mx,my);
  if (ml > 0) { mx/=ml; my/=ml; }
  player.x += mx * player.speed * dt;
  player.y += my * player.speed * dt;
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));
  player.angle = Math.atan2(mouse.y-player.y, mouse.x-player.x);
  if (player.cd > 0) player.cd -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.swing) {
    player.swing.t += dt;
    if (player.swing.t >= player.swing.dur) player.swing = null;
  }

  // roaches
  const spdMul = 1 - player.slow;
  for (let i = roaches.length-1; i >= 0; i--) {
    const r = roaches[i];
    const dx = player.x - r.x, dy = player.y - r.y;
    const d = Math.hypot(dx,dy) || 1;
    r.wob += dt*9;
    const wa = Math.sin(r.wob)*.5;
    const base = Math.atan2(dy,dx);
    r.angle = base + wa;
    r.x += Math.cos(base+wa)*r.speed*spdMul*dt;
    r.y += Math.sin(base+wa)*r.speed*spdMul*dt;
    if (r.hitFlash > 0) r.hitFlash -= dt;
    // queen spawns babies
    if (r.type === 'queen') {
      r.babyCd -= dt;
      if (r.babyCd <= 0 && roaches.length < 50) {
        r.babyCd = 2.4;
        const b = makeRoach('fast');
        b.x = r.x + (Math.random()*30-15); b.y = r.y + (Math.random()*30-15);
        roaches.push(b);
        splat(r.x, r.y);
      }
    }
    // separation
    for (let j = i-1; j >= 0; j--) {
      const o = roaches[j];
      const sx = r.x-o.x, sy = r.y-o.y, sd = Math.hypot(sx,sy);
      const min = (r.size+o.size)*.5*.7;
      if (sd > 0 && sd < min) {
        const push = (min-sd)*.5;
        r.x += sx/sd*push; r.y += sy/sd*push;
        o.x -= sx/sd*push; o.y -= sy/sd*push;
      }
    }
    // hit player
    if (d < r.size*.55 + player.r && player.invuln <= 0) {
      const dmg = r.type==='tank' ? 16 : r.type==='queen' ? 20 : r.type==='fast' ? 8 : 11;
      player.hp -= dmg;
      player.invuln = .8;
      shake = Math.max(shake, 8);
      sfx.hurt();
      texts.push({x:player.x, y:player.y-30, t:'-'+dmg, life:1, col:'#ff5566'});
      // knockback roach
      r.x -= dx/d*40; r.y -= dy/d*40;
      if (player.hp <= 0) { gameOver(); return; }
    }
  }

  // pickups
  for (let i = pickups.length-1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    const dx = player.x-p.x, dy = player.y-p.y, d = Math.hypot(dx,dy);
    if (d < 90) { p.x += dx/d*140*dt; p.y += dy/d*140*dt; }
    if (d < player.r + 14) {
      if (p.kind==='heart') { player.hp = Math.min(player.maxHp, player.hp+15);
        texts.push({x:p.x, y:p.y, t:'+15 ❤', life:1, col:'#7CFC98'}); }
      else { score += 50; texts.push({x:p.x, y:p.y, t:'+50 ⭐', life:1, col:'#ffd166'}); }
      sfx.pickup();
      pickups.splice(i,1); continue;
    }
    if (p.life <= 0) pickups.splice(i,1);
  }

  // particles & texts & splats
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .92; p.vy *= .92;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = texts.length-1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt; t.y -= 45*dt;
    if (t.life <= 0) texts.splice(i,1);
  }
  for (let i = splats.length-1; i >= 0; i--) {
    splats[i].life -= dt*.15;
    if (splats[i].life <= 0) splats.splice(i,1);
  }
}

/* ---------- draw ---------- */
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

  // floor
  const g = ctx.createRadialGradient(W/2,H/2,80, W/2,H/2,650);
  g.addColorStop(0,'#22345c'); g.addColorStop(1,'#0d1526');
  ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
  for (let x=0; x<=W; x+=48) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<=H; y+=48) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // splat decals
  splats.forEach(s => {
    ctx.globalAlpha = Math.min(.5, s.life*.12);
    ctx.fillStyle = '#4d6b1f';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r*.7, .4, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // pickups
  ctx.textAlign='center'; ctx.textBaseline='middle';
  pickups.forEach(p => {
    ctx.font = '24px serif';
    ctx.fillText(p.kind==='heart' ? '❤️' : '⭐', p.x, p.y + Math.sin(performance.now()/200)*3);
  });

  // roaches
  roaches.forEach(r => {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.angle + Math.PI/2);
    ctx.font = r.size + 'px serif';
    ctx.globalAlpha = r.hitFlash > 0 ? .5 : 1;
    ctx.fillText('🪳', 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
    // hp bar for tanks/queens
    if (r.maxHp > 1) {
      ctx.fillStyle = '#000a'; ctx.fillRect(r.x-18, r.y-r.size*.8-10, 36, 5);
      ctx.fillStyle = '#7CFC98'; ctx.fillRect(r.x-18, r.y-r.size*.8-10, 36*r.hp/r.maxHp, 5);
    }
  });

  // player
  if (player) {
    const blink = player.invuln > 0 && Math.floor(performance.now()/80)%2===0;
    if (!blink) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.font = '40px serif';
      ctx.fillText('🧔🏻‍♂️', 0, 2);
      ctx.restore();
      // swing animation
      if (player.swing) {
        const s = player.swing, prog = s.t/s.dur;
        const cur = s.dir - s.arc/2 + s.arc*prog;
        ctx.save();
        ctx.translate(player.x, player.y);
        // arc trail
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,92, s.dir-s.arc/2, cur);
        ctx.closePath();
        ctx.fillStyle = `rgba(255,153,51,${.28*(1-prog)})`;
        ctx.fill();
        // chappal
        ctx.rotate(cur);
        ctx.font = '38px serif';
        ctx.fillText('🩴', 74, 0);
        ctx.restore();
      }
    }
  }

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life*1.6);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // floating texts
  texts.forEach(t => {
    ctx.globalAlpha = Math.min(1, t.life*2);
    ctx.font = 'bold 16px Segoe UI';
    ctx.fillStyle = t.col;
    ctx.fillText(t.t, t.x, t.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // crosshair
  if (state === 'play' && !('ontouchstart' in window)) {
    ctx.strokeStyle = '#ff9933'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x-14,mouse.y); ctx.lineTo(mouse.x+4,mouse.y);
    ctx.moveTo(mouse.x+6,mouse.y); ctx.lineTo(mouse.x+14,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-14); ctx.lineTo(mouse.x,mouse.y+4);
    ctx.moveTo(mouse.x,mouse.y+6); ctx.lineTo(mouse.x,mouse.y+14);
    ctx.stroke();
  }

  // HUD
  if (player && (state==='play' || state==='upgrade')) {
    // HP bar
    ctx.fillStyle = '#0009'; ctx.fillRect(16, 14, 220, 18);
    const hpPct = Math.max(0, player.hp/player.maxHp);
    ctx.fillStyle = hpPct > .5 ? '#7CFC98' : hpPct > .25 ? '#ffd166' : '#ff5566';
    ctx.fillRect(18, 16, 216*hpPct, 14);
    ctx.strokeStyle = '#ffffff33'; ctx.strokeRect(16, 14, 220, 18);
    ctx.font = 'bold 12px Segoe UI'; ctx.fillStyle = '#fff';
    ctx.textAlign='left';
    ctx.fillText(`❤ ${Math.max(0,Math.ceil(player.hp))}/${player.maxHp}`, 22, 26);

    ctx.font = 'bold 15px Segoe UI';
    ctx.fillStyle = '#ffd166';
    ctx.fillText(`WAVE ${wave}`, W/2 - 30, 26);
    ctx.fillStyle = '#fff';
    ctx.textAlign='right';
    ctx.fillText(`SCORE ${score}`, W-18, 26);
    if (combo >= 2) {
      ctx.fillStyle = '#7CFC98';
      ctx.fillText(`COMBO x${combo}`, W-18, 48);
    }
    if (banner && banner.t > 0) {
      ctx.globalAlpha = Math.min(1, banner.t);
      ctx.textAlign='center';
      ctx.font = '900 54px Segoe UI';
      ctx.fillStyle = '#ff9933';
      ctx.shadowColor='#000'; ctx.shadowBlur=16;
      ctx.fillText(banner.text, W/2, H/2 - 60);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }
  }
}

/* ---------- loop & resize ---------- */
function loop(now) {
  const dt = Math.min(.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function fit() {
  const s = Math.min(window.innerWidth*.96/W, (window.innerHeight-20)/H);
  canvas.style.width = W*s + 'px';
  canvas.style.height = H*s + 'px';
}
window.addEventListener('resize', fit);
fit();
</script>
</body>
